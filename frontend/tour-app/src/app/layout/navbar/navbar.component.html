<nav class="navbar">
  <div class="navbar-brand" (click)="onBrandClick()">
    Tour App
  </div>

  <div class="navbar-actions">
    <ng-container *ngIf="isLoggedIn">
      <button class="nav-btn" (click)="onBlogsClick()">Blogs</button>
      <button class="nav-btn" (click)="onProfileClick()">Follow Recommendations</button>
      <button *ngIf="isGuide" class="nav-btn" (click)="onMyToursClick()">My Tours</button>
      <button *ngIf="isTourist" class="nav-btn" (click)="onTourSimClick()">Tour Simulator</button>
      <button *ngIf="isTourist" class="nav-btn" (click)="onMyExecutionsClick()">My Executions</button>
      <button class="nav-btn logout-btn" (click)="onLogoutClick()">Logout</button>
    </ng-container>

    <ng-container *ngIf="!isLoggedIn">
      <button class="nav-btn login-btn" (click)="onLoginClick()">Login</button>
    </ng-container>
  </div>
</nav>
