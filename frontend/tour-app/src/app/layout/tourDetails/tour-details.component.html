<div *ngIf="tour" class="tour-page">

  <div class="tour-hero">

    <div class="tour-hero-content">

      <div class="title-row">
        <h1 class="tour-title">{{ tour.Title }}</h1>
        <span class="published-date" *ngIf="tour.PublishedAt">
          Published: {{ tour.PublishedAt | date:'mediumDate' }}
        </span>
      </div>

      <p class="tour-description">
        {{ tour.Description }}
      </p>

      <div class="duration-row">
        <div class="duration-item" *ngIf="tour.DurationWalk">
          <span class="duration-label">Walk</span>
          <span class="duration-value">{{ tour.DurationWalk }} min</span>
        </div>
        <div class="duration-item" *ngIf="tour.DurationBike">
          <span class="duration-label">Bike</span>
          <span class="duration-value">{{ tour.DurationBike }} min</span>
        </div>
        <div class="duration-item" *ngIf="tour.DurationCar">
          <span class="duration-label">Car</span>
          <span class="duration-value">{{ tour.DurationCar }} min</span>
        </div>
      </div>

      <div class="tour-badges">
        <span class="badge price" *ngIf="tour.Price">
          {{ tour.Price }} €
        </span>
        <span class="badge" *ngIf="distanceKm">
          {{ distanceKm | number:'1.1-2' }} km
        </span>
        <button (click)="addToCart()" class="btn-view">Add to Cart</button>
      </div>

    </div>

  </div>

  <div class="tour-body">
    <app-tour-review
      *ngIf="tour?.id"
      [tourID]="tour.id">
    </app-tour-review>
  </div>

</div>
