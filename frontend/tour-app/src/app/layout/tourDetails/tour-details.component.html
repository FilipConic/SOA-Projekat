<div *ngIf="tour" class="tour-page">

  <div class="tour-hero">

    <div class="tour-hero-content">

      <h1 class="tour-title">{{ tour.Title }}</h1>

      <p class="tour-description">
        {{ tour.Description }}
      </p>

      <!-- META STRIP -->
      <div class="tour-badges">

        <span class="badge">
          {{ tour.DurationWalk }} min
        </span>

        <span class="badge price">
          {{ tour.Price }} €
        </span>

        <span class="badge" *ngIf="distanceKm">
          {{ distanceKm | number:'1.1-2' }} km
        </span>

        <span class="badge" *ngIf="keypoints?.length">
          Start: {{ keypoints[0]?.Name }}
        </span>

      </div>

    </div>

  </div>

  <div class="tour-body">
    <app-tour-review
      *ngIf="tour?.id"
      [tourID]="tour.id">
    </app-tour-review>
  </div>

</div>
