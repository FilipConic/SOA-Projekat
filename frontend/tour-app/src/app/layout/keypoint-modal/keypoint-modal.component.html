<div class="modal-backdrop" (click)="$event.target === $event.currentTarget && close.emit()">
  <div class="modal-content">
    <h3>{{ keypointData ? 'Edit Keypoint' : 'Create Keypoint' }}</h3>
    
    <div class="modal-map-wrapper">
      <label><strong>Select location on map *</strong></label>
      <xp-map 
        [mapId]="'modal-map'"
        [mapType]="modalMapType" 
        [waypoints]="modalWaypoints"
        [waypointToUpdate]="modalWaypointToUpdate"
        [width]="'100%'" 
        [height]="'250px'"
        (newWaypoint)="onMapClick($event)">
      </xp-map>
    </div>

    <form [formGroup]="keypointForm" >
      <label>Keypoint Name</label>
      <input type="text" formControlName="name" placeholder="e.g., City Museum">

      <label>Description</label>
      <textarea formControlName="description" placeholder="Enter description..."></textarea>

      <label>Image</label>
    <input 
        type="file" 
        (change)="onFileSelected($event)" 
        accept="image/*"
        style="position: relative; z-index: 99999; cursor: pointer;"
        (click)="$event.stopPropagation()" 
        (mousedown)="$event.stopPropagation()">

    <div class="image-preview" *ngIf="imagePreview">
    <p>Image Preview:</p>
    <img [src]="imagePreview" alt="Preview" style="max-width: 100%; max-height: 150px; border-radius: 4px;">
    </div>

      <div class="coords-row">
        <div>
          <label>Lat (Latitude)</label>
          <input type="number" formControlName="latitude" readonly placeholder="Click on the map">
        </div>
        <div>
          <label>Lng (Longitude)</label>
          <input type="number" formControlName="longitude" readonly placeholder="Click on the map">
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="close.emit()">Cancel</button>
        <button type="button" class="btn-save" [disabled]="keypointForm.invalid" (click)="onSave()">Save</button>
      </div>
    </form>
  </div>
</div>
