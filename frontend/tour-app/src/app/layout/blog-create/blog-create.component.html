<div class="create-container">
  <div class="create-card">
    <h2 class="create-title">New Blog Post</h2>

    <div class="form-group">
      <label>Title</label>
      <input
        type="text"
        [(ngModel)]="title"
        placeholder="Enter a title"
        class="form-input" />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        [(ngModel)]="description"
        placeholder="Write your blog post..."
        class="form-textarea"></textarea>
    </div>

    <div class="form-group">
      <label>Image URLs <span class="optional">(optional)</span></label>
      <div class="image-row" *ngFor="let img of images; let i = index">
        <input
          type="text"
          [(ngModel)]="images[i]"
          placeholder="https://..."
          class="form-input" />
        <button class="remove-btn" (click)="images.splice(i, 1)">✕</button>
      </div>
      <button class="add-image-btn" (click)="images.push('')">+ Add image URL</button>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="form-actions">
      <button class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button class="submit-btn" [disabled]="submitting" (click)="onSubmit()">
        {{ submitting ? 'Publishing...' : 'Publish' }}
      </button>
    </div>
  </div>
</div>
