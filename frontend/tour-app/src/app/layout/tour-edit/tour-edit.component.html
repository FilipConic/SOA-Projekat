<div class="edit-layout">
  <div class="left-column">
    <xp-map 
      [mapType]="'showWaypoints'" 
      [waypoints]="mapWaypoints" 
      [waypointNames]="mapWaypointNames" 
      [width]="'100%'" 
      [height]="'100%'">
    </xp-map>
  </div>

  <div class="right-column">
    <div class="details-section">
      <h2>Tour Details</h2>
      <form [formGroup]="tourForm" (ngSubmit)="saveMainDetails()">
        <input type="text" formControlName="title" placeholder="Title">
        <textarea formControlName="description" placeholder="Description"></textarea>
        
        <div class="row">
          <select formControlName="difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium">Medium</option>
            <option value="Hard">Hard</option>
          </select>
          <input type="text" formControlName="tags" placeholder="Tags (comma separated)">
        </div>

        <div class="row">
          <input type="number" formControlName="price" placeholder="Price (€)">
          <small class="hint">Price in Euros</small>

          <input type="number" formControlName="duration" placeholder="Duration (min)">
          <small class="hint">Approximate duration in minutes</small>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary" [disabled]="tourForm.invalid">Save</button>
          <button 
            type="button"
            class="btn-publish" 
            (click)="publishTour()" 
            [disabled]="!canPublish()"
            [title]="!canPublish() ? 'Need: filled data, duration > 0, min 2 keypoints' : 'Publish tour'">
            Publish
          </button>
        </div>
      </form>
    </div>

    <div class="keypoints-section">
      <div class="header-row">
        <h3>Keypoints</h3>
        <button (click)="openCreateModal()" class="btn-success">+ Add keypoint</button>
      </div>

      <div *ngIf="keypoints.length < 2" class="warning-msg">
        Add at least 2 keypoints to publish the tour.
      </div>

      <div class="keypoint-cards">
        <div class="card" *ngFor="let kp of keypoints">
          <div class="card-info">
            <strong>{{ kp.Name }}</strong>
          </div>
          <div class="card-actions">
            <button (click)="openEditModal(kp)">Edit</button>
            <button class="btn-danger" (click)="deleteKeypoint(kp.ID)">Delete</button>
          </div>
        </div>
      </div>

      <div class="tour-metrics" *ngIf="distanceKm > 0">
        <span>Total distance: {{ distanceKm | number:'1.2-2' }} km</span>
      </div>
    </div>
  </div>
</div>

<app-keypoint-modal 
  *ngIf="showModal" 
  [tourId]="tourId"
  [keypointData]="selectedKeypoint"
  (close)="closeModal()"
  (saved)="onKeypointSaved()">
</app-keypoint-modal>
