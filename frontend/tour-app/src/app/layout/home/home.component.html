<div class="snackbar" [class.visible]="showSnackbar">
  You must be logged in to view tour details.
</div>

<div class="tour-container">
  <div class="tour-card" *ngFor="let t of tours">
    {{ $any(t).title }}
    <button class="btn-view" (click)="tourDetails($any(t).id)">View</button>
    <button class="btn-view" (click)="startTour($any(t).id)">Start Tour</button>
  </div>
</div>
