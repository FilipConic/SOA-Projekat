<div class="snackbar" [class.visible]="showSnackbar">
  You must be logged in to view tour details.
</div>

<div class="tour-container">
  <div class="tour-grid">
    
    <div class="tour-card" *ngFor="let t of tours">

      <div class="tour-header">
        <h3 class="tour-title">{{ t.Title }}</h3>

        <span class="status" [ngClass]="t.Status">
          {{ t.Status }}
        </span>
      </div>

      <div class="tour-body">
        
        <div class="tour-meta">
          <span>{{ t.Price }} €</span>
          <span>{{ t.Duration }} min</span>
        </div>
      </div>

      <div class="tour-actions">
        <button class="btn secondary" (click)="tourDetails(t.id)">
          View
        </button>

        <button class="btn primary" (click)="startTour(t.id)">
          Start Tour
        </button>
      </div>

    </div>

  </div>
</div>
