<div class="cart-container">
  <h2>Your Shopping Cart</h2>

  <div *ngIf="isLoading" class="status-message">Loading...</div>
  <div *ngIf="errorMessage" class="status-message error">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && (!cart || cart.items.length === 0)" class="empty-cart">
    <p>Your cart is currently empty.</p>
    <button routerLink="/tours" class="btn-browse">Explore Tours</button>
  </div>

  <div *ngIf="!isLoading && cart && cart.items.length > 0" class="cart-content">
    
    <div class="items-list">
      <div *ngFor="let item of cart.items" class="cart-item">
        <div class="item-details">
          <span class="tour-name">{{ item.tourName }}</span>
          <span class="tour-id">ID ture: {{ item.tourId }}</span>
        </div>
        <div class="item-price-action">
          <span class="price">{{ item.price }} RSD</span>
          <button (click)="removeItem(item.id)" class="btn-remove" title="Ukloni stavku">
            &times;
          </button>
        </div>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Number of Tours:</span>
        <span>{{ cart.items.length }}</span>
      </div>
      <hr>
      <div class="summary-row total">
        <span>Total to Pay:</span>
        <span>{{ cart.totalPrice }} RSD</span>
      </div>
      <button (click)="checkout()" class="btn-checkout">
        Continue to Payment
      </button>
    </div>

  </div>
</div>
