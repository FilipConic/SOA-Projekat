<div class="tours-container">
  <h2>Available Tours</h2>

  <div class="tours-grid">
    <mat-card class="tour-card" *ngFor="let tour of tours" [routerLink]="['/tour', tour.id]" style="cursor: pointer;">

      <img mat-card-image src="assets/placeholder-tour.png" alt="Tour Image">

      <mat-card-content>
        <mat-card-title>{{ tour.Title }}</mat-card-title>
        <mat-card-subtitle>Duration: {{ tour.DurationWalk }} mins</mat-card-subtitle>

        <p class="description">
          {{ tour.Description }}
        </p>

        <div class="tour-stats">
          <span><mat-icon>trending_up</mat-icon> {{ tour.Difficulty }}</span>
          <span class="price-tag">
            {{ tour.Price | number:'1.0-2' }}
            <mat-icon>fiber_smart_record</mat-icon>
          </span>
        </div>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button color="primary">
          <mat-icon>visibility</mat-icon> View Details
        </button>
      </mat-card-actions>

    </mat-card>
  </div>
</div>
