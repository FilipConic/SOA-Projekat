services:
  stakeholders-db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=stakeholders_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stakeholders_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-db:
    image: postgres:15
    volumes:
      - blog_postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=blogdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blogdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=123
    volumes:
      - ./config/servers.json:/pgadmin4/servers.json
      - ./config/pgpass:/tmp/pgpass
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - stakeholders-db
      - blog-db

  stakeholders:
    build: ./stakeholders
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./stakeholders:/app
      - ./stakeholders/media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:root@stakeholders-db:5432/stakeholders_db
      - DEBUG=1
    depends_on:
      stakeholders-db:
        condition: service_healthy

  blog:
      build: ./blog-service
      ports:
        - "3000:3000"
      environment:
        - DB_HOST=blog-db
        - DB_PORT=5432
        - DB_NAME=blogdb
        - DB_USER=postgres
        - DB_PASSWORD=postgres
        - JWT_SECRET=django-insecure-c7(b_d%7a&rz%tnm$5de3u8vb(4eoohvp0)_#^ii3wcm2m!t9p
      depends_on:
        blog-db:
          condition: service_healthy

  

  followers-db:
    image: neo4j:5.12
    ports:
      - "7474:7474" 
      - "7687:7687" 
    environment:
      - NEO4J_AUTH=neo4j/password123 
    volumes:
      - neo4j_data:/data

  followers-service:
    build: ./followers/demo
    ports:
      - "8081:8081"
    environment:
      - SPRING_NEO4J_URI=bolt://followers-db:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password123
    depends_on:
      - followers-db

volumes:
  postgres_data:
  blog_postgres_data:
  pgadmin_data:
  media:
  neo4j_data:

